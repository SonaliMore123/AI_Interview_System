<!DOCTYPE html>
<html>
<head>
    <title>AI Interview Preparation</title>

    <style>

        body{
            font-family: Arial;
            margin:40px;
        }

        .box{
            border:1px solid black;
            padding:20px;
            margin-top:20px;
        }

        button{
            padding:10px;
            margin:5px;
            cursor:pointer;
        }

        textarea{
            width:400px;
            height:100px;
        }

    </style>

</head>

<body>


<h1>AI Interview Preparation System</h1>


<!-- Start Interview -->

<div class="box">

    <h3>Start Interview</h3>

    <input
            type="text"
            id="role"
            placeholder="Enter Job Role">


    <button onclick="startInterview()">
        Start Interview
    </button>


</div>



<!-- Questions -->

<div class="box" id="questionSection" style="display:none">


    <h3>Select Question</h3>

    <div id="questionList"></div>


</div>




<!-- Answer -->

<div class="box" id="answerSection" style="display:none">


    <h3 id="selectedQuestion"></h3>


    <textarea
            id="answer"
            placeholder="Enter your answer">
</textarea>


    <br>


    <button onclick="submitAnswer()">
        Submit Answer
    </button>


</div>




<!-- Feedback -->

<div class="box" id="feedbackSection" style="display:none">


    <h3>Evaluation</h3>


    <p id="score"></p>

    <p id="feedback"></p>


    <button onclick="nextQuestion()">
        Next Question
    </button>


</div>




<!-- Final Result -->

<div class="box" id="resultSection" style="display:none">


    <h2>Final Result</h2>


    <p id="finalScore"></p>

    <p id="overallFeedback"></p>


</div>



<script src="script.js"></script>


</body>
</html>
