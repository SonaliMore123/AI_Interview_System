<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Interview Preparation System</title>


    <style>

        body{
            font-family: Arial;
            margin:40px;
            background:#f5f5f5;
        }


        .box{

            border:1px solid black;

            padding:20px;

            margin-top:20px;

            background:white;

            border-radius:10px;

        }


        button{

            padding:10px 15px;

            margin:5px;

            cursor:pointer;

        }


        textarea{

            width:400px;

            height:100px;

        }


        input{

            padding:10px;

            width:300px;

        }


    </style>


</head>



<body>



<h1>AI Interview Preparation System</h1>



<!-- Start Interview Section -->

<div class="box" id="startSection">


    <h3>Start Interview</h3>


    <input
            type="text"
            id="role"
            placeholder="Enter Job Role">


    <button onclick="startInterview()">

        Start Interview

    </button>


</div>





<!-- Questions Section -->

<div class="box" id="questionSection" style="display:none;">


    <h3>Select Question</h3>


    <div id="questionList"></div>


</div>





<!-- Answer Section -->

<div class="box" id="answerSection" style="display:none;">


    <h3 id="selectedQuestion"></h3>



    <textarea
            id="answer"
            placeholder="Enter your answer">
    </textarea>


    <br>


    <button onclick="submitAnswer()">

        Submit Answer

    </button>



    <button onclick="nextQuestion()">

        Next Question

    </button>


</div>





<!-- Feedback Section -->

<div class="box" id="feedbackSection" style="display:none;">


    <h3>Evaluation</h3>


    <p id="score"></p>


    <p id="feedback"></p>


</div>





<!-- Final Result Section -->

<div class="box" id="resultSection" style="display:none;">


    <h2>Final Result</h2>


    <p id="finalScore"></p>


    <p id="overallFeedback"></p>


</div>





<script src="/script.js"></script>



</body>


</html>
